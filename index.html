<!doctype html>
<html lang="en" class="it-theme" data-theme="dark" data-accent="blue">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="index, follow" />
    <meta name="description" content="Free, simple and open-source QR code generator. Generate a QR code or learn how it is built, step by step." />
    <meta name="keywords" content="QRCode, QR Code Generator, Learn QR Code, Open-source, WASM" />
    <meta name="author" content="FortyTwo_Dev" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://qrcode.infinityproject.fr/" />
    <meta property="og:title" content="Infinity QRCode: Generate and learn QR codes" />
    <meta property="og:description" content="Generate QR codes and understand how they are constructed, frame by frame." />
    <meta property="og:image" content="https://qrcode.infinityproject.fr/img/qrcode.png" />
    <meta property="og:image:width" content="200" />
    <meta property="og:image:height" content="200" />
    <meta property="og:site_name" content="Infinity QRCode" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Infinity QRCode: Generate and learn QR codes" />
    <meta name="twitter:description" content="Generate QR codes and understand how they are constructed, frame by frame." />
    <meta name="twitter:image" content="https://qrcode.infinityproject.fr/img/qrcode.png" />
    <link rel="canonical" href="https://qrcode.infinityproject.fr/" />
    <link href="/src/css/style.css" rel="stylesheet" />
    <title>Infinity QRCode</title>
    <script>
      ;(() => {
        try {
          const storedMode = localStorage.getItem('theme')
          const color = localStorage.getItem('themeColor') || 'blue'
          const dark = storedMode
            ? storedMode === 'dark'
            : window.matchMedia('(prefers-color-scheme: dark)').matches
          document.documentElement.dataset.theme = dark ? 'dark' : 'light'
          document.documentElement.dataset.accent = color
          if (localStorage.getItem('readingFont') === 'dyslexic') {
            document.documentElement.dataset.font = 'dyslexic'
          }
        } catch {
          // The theme composable applies the default when storage is unavailable.
        }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
