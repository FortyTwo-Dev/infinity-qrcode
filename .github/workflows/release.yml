name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  image:
    needs: release
    if: needs.release.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/fortytwo-dev/infinity-qrcode
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
      TAG_NAME: ${{ needs.release.outputs.tag_name }}
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Retag the tested image
        run: |
          set -euo pipefail
          if [ -z "${SOURCE_SHA:-}" ]; then
            echo "SOURCE_SHA is empty" >&2
            exit 1
          fi
          if [ -z "${TAG_NAME:-}" ]; then
            echo "TAG_NAME is empty" >&2
            exit 1
          fi
          docker buildx imagetools create \
            --annotation "index:org.opencontainers.image.source=https://github.com/FortyTwo-Dev/infinity-qrcode" \
            --annotation "index:org.opencontainers.image.version=$TAG_NAME" \
            --annotation "index:org.opencontainers.image.revision=$SOURCE_SHA" \
            --annotation "index:org.opencontainers.image.licenses=MIT" \
            --tag "$IMAGE:$TAG_NAME" \
            --tag "$IMAGE:latest" \
            "$IMAGE:sha-$SOURCE_SHA"
